<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Hub Proxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #120c1f 0%, #25123e 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 4.5rem;
            color: #ff66cc;
            margin: 0 0 10px 0;
            text-shadow: 0px 0px 15px rgba(255, 102, 204, 0.6);
        }
        .status {
            font-size: 1rem;
            color: #a3a3a3;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        .proxy-form input[type="text"] {
            width: 80%;
            padding: 12px 20px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 2px solid #ff66cc;
            border-radius: 50px;
            background-color: rgba(0,0,0,0.4);
            color: white;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }
        .proxy-form button {
            background-color: #ff66cc;
            color: white;
            padding: 12px 30px;
            margin-top: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.3s;
        }
        .proxy-form button:hover {
            background-color: #e04db3;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status">● Online</div>
    <h1>Chill Hub</h1>
    <div class="proxy-form">
        <!-- Replace the action URL with your backend proxy script if using node/php -->
        <form action="/proxy-gate" method="GET">
            <input type="text" name="url" placeholder="Type man....." required>
            <br>
            <button type="submit">Browse</button>
        </form>
    </div>
</div>

</body>
</html>
